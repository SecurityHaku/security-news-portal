name: ニュース自動更新

# 毎週月曜 06:00 JST（= 日曜 21:00 UTC）に収集・採点し、変更があれば news.json をコミット。
# 手動実行も可（Actions タブ -> このワークフロー -> Run workflow）。
on:
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MYMEMORY_EMAIL: ${{ vars.MYMEMORY_EMAIL }}
      ENRICH_FREE_SUMMARY_TOP_N: ${{ vars.ENRICH_FREE_SUMMARY_TOP_N }}
      ENRICH_TRANSLATE_MODEL: ${{ vars.ENRICH_TRANSLATE_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージ
        run: python -m pip install -r requirements.txt

      - name: 収集
        run: python scripts/collect.py

      - name: 採点
        run: python scripts/score.py

      - name: 日本語化（翻訳のみ。無料エンジン。キー設定時はLLM）
        run: python scripts/enrich.py --only-translate

      - name: 変更をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/news.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: ニュース自動更新 ($(date -u +%Y-%m-%d))"
            git push
          fi
